<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" routerLink="/">
      <span class="fs-5">💻 Tech Solutions</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMobileMenu()"
      [class.collapsed]="!mobileMenuOpen"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="mobileMenuOpen" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-2">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()"
          >
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/projects" routerLinkActive="active" (click)="closeMobileMenu()">
            Projects
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">
            Contact
          </a>
        </li>
        <li class="nav-item" *ngIf="developerModeEnabled">
          <a class="nav-link" routerLink="/admin" routerLinkActive="active" (click)="closeMobileMenu()">
            Admin
          </a>
        </li>
      </ul>

      <button
        class="btn ms-3"
        [class.btn-primary]="!developerModeEnabled"
        [class.btn-success]="developerModeEnabled"
        (click)="toggleDeveloperMode()"
        title="Toggle Developer Mode"
      >
        <span *ngIf="!developerModeEnabled">🔒 Dev Mode</span>
        <span *ngIf="developerModeEnabled">🔓 Dev Mode</span>
      </button>
    </div>
  </div>
</nav>
